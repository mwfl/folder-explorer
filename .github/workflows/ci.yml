name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure (Visual Studio 2022 x64)
        run: cmake --preset vs2022-x64
      - name: Build
        run: cmake --build --preset vs2022-x64-release --parallel 2
      - name: Test
        run: ctest --test-dir build/vs2022-x64 -C Release --output-on-failure
      - name: Package portable app
        shell: pwsh
        run: |
          cmake --install build/vs2022-x64 --config Release --prefix package --component Application
          Compress-Archive -Path package/* -DestinationPath folder-explorer-windows-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: folder-explorer-windows-x64
          path: folder-explorer-windows-x64.zip
